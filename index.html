<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Maiku x Mira VN</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Georgia, serif;
  overflow:hidden;
}

.scene{
  display:none;
  height:100vh;
  width:100vw;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  text-align:center;
}

.scene.active{ display:flex; }

img{
  width:min(90vw,520px);
  max-height:40vh;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:10px;
}

button{
  padding:10px 14px;
  margin:8px;
  font-size:16px;
}

.options{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
}

.card{
  background:#222;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  min-width:120px;
}

canvas{
  background:#111;
  border-radius:8px;
}

#bar{
  width:80%;
  height:16px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
}

#fill{
  height:100%;
  width:100%;
  background:limegreen;
}

#finalText p{
  opacity:0;
  transform:translateY(20px);
  transition:1s;
  white-space:pre-line;
}
</style>
</head>

<body>

<!-- SCENE 0 -->
<div id="s0" class="scene active">
  <img src="image1.jpg">
  <p>Maiku and Mira enter the portal...</p>
  <button onclick="go(1)">Start</button>
</div>

<!-- SCENE 1 -->
<div id="s1" class="scene">
  <h3>Answer to unlock the message</h3>
  <h2 id="qtext"></h2>
  <div class="options" id="options"></div>
  <button onclick="submit()">Submit</button>
</div>

<!-- SCENE 2 -->
<div id="s2" class="scene">
  <img src="image2.jpg">
  <p><b>Drive safely to reach the bridge.</b></p>
  <canvas id="game2" width="300" height="400"></canvas>
  <p>Time: <span id="time">30</span></p>
</div>

<!-- SCENE 3 -->
<div id="s3" class="scene">
  <img src="image3.jpg">
  <p><b>Cross the bridge.</b></p>

  <div id="bar"><div id="fill"></div></div>

  <p>Stamina: <span id="staminaText">100</span></p>
  <p>Time: <span id="time3">25</span></p>

  <button onclick="smooch()">💖 Action</button>
</div>

<!-- SCENE 4 -->
<div id="s4" class="scene">
  <img src="image4.jpg">
  <div id="finalText"></div>
</div>

<script>

/* NAV */
function go(n){
  document.querySelectorAll(".scene").forEach(s=>s.classList.remove("active"));
  document.getElementById("s"+n).classList.add("active");

  if(n===2) startDrive();
  if(n===3) startBridge();
}

/* ================= SCENE 1 ================= */

let qs=[
["Mira ice cream?",["chocolate","strawberry","rocky road"],"chocolate"],
["Comfort dish?",["soupy dishes","chicken","sushi"],"soupy dishes"],
["Fast food?",["pizza","burger","tacos"],"pizza"],
["Expression?",["ayioo","omg","wtf"],"ayioo"],
["Subject?",["math","history","language"],"math"],
["Overthinking?",["keep quiet","talk more","sleep"],"keep quiet"],
["Likes about Maiku?",["all of the above","brain","humor"],"all of the above"]
];

let i=0, selected="";

function shuffle(a){
  return a.sort(()=>Math.random()-0.5);
}

function showQ(){
  let q=qs[i];
  document.getElementById("qtext").innerText=q[0];

  let box=document.getElementById("options");
  box.innerHTML="";

  shuffle([...q[1]]).forEach(opt=>{
    let d=document.createElement("div");
    d.className="card";
    d.innerText=opt;
    d.onclick=()=>selected=opt;
    box.appendChild(d);
  });
}

function submit(){
  if(!selected) return;

  if(selected===qs[i][2]){
    i++;
    selected="";
    if(i>=qs.length){
      go(2);
    } else showQ();
  }
}

showQ();

/* ================= SCENE 2 ================= */

let carX=120, obs=[], run=false, ctx, time=30, driveInterval;

function startDrive(){

  run=true;
  time=30;
  carX=120;

  ctx=document.getElementById("game2").getContext("2d");

  obs=[
    {x:50,y:-80},
    {x:120,y:-160},
    {x:200,y:-240}
  ];

  driveInterval=setInterval(()=>{
    time--;
    document.getElementById("time").innerText=time;

    if(time<=0){
      stopDrive();
      go(3);
    }
  },1000);

  loop();
}

function stopDrive(){
  run=false;
  clearInterval(driveInterval);
}

function crash(){
  stopDrive();
  setTimeout(()=>startDrive(),500);
}

document.getElementById("game2").addEventListener("click",(e)=>{
  if(!run) return;
  let x=e.clientX-e.target.getBoundingClientRect().left;
  carX += (x<150?-20:20);
  carX=Math.max(0,Math.min(260,carX));
});

function loop(){
  if(!run) return;

  ctx.fillStyle="#111";
  ctx.fillRect(0,0,300,400);

  ctx.fillStyle="#333";
  ctx.fillRect(50,0,200,400);

  ctx.fillStyle="#00d4ff";
  ctx.fillRect(carX,340,40,18);

  ctx.fillStyle="red";

  for(let o of obs){
    o.y+=4;
    ctx.fillRect(o.x,o.y,30,30);

    if(o.y>320 && o.y<360 && o.x<carX+40 && o.x+30>carX){
      crash();
      return;
    }
  }

  requestAnimationFrame(loop);
}

/* ================= SCENE 3 ================= */

let stamina=100, time3=25, bridgeInterval;

function startBridge(){

  stamina=100;
  time3=25;

  document.getElementById("staminaText").innerText=stamina;
  document.getElementById("fill").style.width="100%";

  bridgeInterval=setInterval(()=>{

    time3--;
    stamina-=8;

    document.getElementById("time3").innerText=time3;
    document.getElementById("staminaText").innerText=stamina;
    document.getElementById("fill").style.width=stamina+"%";

    if(stamina<=0){
      restartBridge();
    }

    if(time3<=0){
      stopBridge();
      showFinal();
    }

  },1000);
}

function restartBridge(){
  clearInterval(bridgeInterval);
  setTimeout(()=>startBridge(),500);
}

function stopBridge(){
  clearInterval(bridgeInterval);
}

function smooch(){
  stamina=Math.min(100, stamina+10);
}

/* ================= FINAL ================= */

function showFinal(){

  go(4);

  let el=document.getElementById("finalText");
  el.innerHTML="";

  let text=`This is the beginning of our adventure together,
No pressure, no expectations~
Let's enjoy our first ever weekend together, hoping it might unlock more opportunities to spend time with each other.
Hang in there a little longer, babe,
Questions will be answered, doubts will be clarified...`;

  let p=document.createElement("p");
  p.innerText=text;

  el.appendChild(p);

  setTimeout(()=>{
    p.style.opacity="1";
    p.style.transform="translateY(0)";
  },100);
}

</script>

</body>
</html>
