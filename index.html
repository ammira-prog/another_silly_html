<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Maiku x Mira VN</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Georgia, serif;
  overflow:hidden;
}

/* PORTAL TRANSITION */
#portalFlash{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:white;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.5s;
  z-index:999;
}

.scene{
  display:none;
  height:100vh;
  width:100vw;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  box-sizing:border-box;
  text-align:center;
}

.scene.active{ display:flex; }

img{
  width:min(90vw,520px);
  max-height:40vh;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:10px;
}

button{
  padding:10px 14px;
  margin:8px;
  font-size:16px;
}

.options{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
}

.card{
  background:#222;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  min-width:120px;
}

canvas{
  background:#111;
  border-radius:8px;
}

#bar{
  width:80%;
  height:16px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin:0 auto;
}

#fill{ height:100%; width:100%; background:limegreen; }

#finalText{
  max-width:650px;
  padding:20px;
  line-height:1.8;
}

#finalText p{
  opacity:0;
  transform:translateY(18px);
  transition:1s;
  white-space:pre-line;
}

/* SUCCESS OVERLAY */
.success{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  flex-direction:column;
}
</style>
</head>

<body>

<div id="portalFlash"></div>

<!-- SCENES -->

<div id="s0" class="scene active">
  <img src="image1.jpg">
  <p>Maiku and Mira enter the portal...</p>
  <button onclick="portalToScene1()">Start</button>
</div>

<div id="s1" class="scene">
  <h4>Sydney — Split Timeline</h4>
  <p>Answer the following questions correctly.</p>

  <h3 id="qtext"></h3>
  <div class="options" id="options"></div>

  <button onclick="submit()">Submit</button>
</div>

<div id="s2" class="scene">
  <img src="image2.jpg">

  <div id="driveIntro">
    <p><b>Get to the Sydney bridge safely before time runs out.</b></p>
    <button onclick="startDrive()">Start Drive</button>
  </div>

  <div id="driveGame" style="display:none;">
    <canvas id="game2" width="300" height="400"></canvas>
    <p>Time: <span id="time">30</span></p>
  </div>
</div>

<div id="s3" class="scene" style="position:relative;">
  <div id="bridgeIntro">
    <img src="image3.jpg">
    <h3>🌉 Bridge Crossing Mission</h3>
    <button onclick="startBridge()">Start Crossing</button>
  </div>

  <div id="bridgeGame" style="display:none;">
    <div id="bar"><div id="fill"></div></div>
    <img src="image3_avatar.png" style="width:240px;height:240px;border-radius:12px;">
    <button onclick="smooch()">💖 SMOOCH</button>
    <p>Time Left: <span id="time3">25</span></p>
    <div id="bridgeOverlay" class="success"></div>
  </div>
</div>

<div id="s4" class="scene">
  <img src="image4.jpg">
  <div id="finalText"></div>
</div>

<script>

/* PORTAL TRANSITION */
function portalToScene1(){
  const flash=document.getElementById("portalFlash");
  flash.style.opacity=1;

  setTimeout(()=>{
    flash.style.opacity=0;
    go(1);
  },500);
}

/* NAV */
function go(n){
  document.querySelectorAll(".scene").forEach(s=>s.classList.remove("active"));
  document.getElementById("s"+n).classList.add("active");
}

/* SHUFFLE (NEW) */
function shuffle(a){
  return a.sort(()=>Math.random()-0.5);
}

/* ================= SCENE 1 ================= */

let qs=[
["What is Mira's favorite ice cream flavor?",["chocolate","strawberry","rocky road"],"chocolate"],
["What is Mira's comfort dish?",["soupy dishes","chicken","sushi"],"soupy dishes"],
["What is Mira's favorite fast food?",["pizza","burger","tacos"],"pizza"],
["Which expression does Mira use the most?",["ayioo","omg","wtf"],"ayioo"],
["What is Mira's strongest subject?",["math","history","language"],"math"],
["When overthinking, Mira usually:",["keep quiet","talk more","sleep"],"keep quiet"],
["What does Mira like about Maiku?",["all of the above","brain","humor"],"all of the above"]
];

let i=0, selected="";

function showQ(){
  const q=qs[i];
  document.getElementById("qtext").innerText=q[0];

  const box=document.getElementById("options");
  box.innerHTML="";

  shuffle(q[1]).forEach(opt=>{
    let d=document.createElement("div");
    d.className="card";
    d.innerText=opt;
    d.onclick=()=>selected=opt;
    box.appendChild(d);
  });
}

function submit(){
  if(!selected) return;
  if(selected!==qs[i][2]) return;

  selected="";
  i++;

  if(i>=qs.length){
    driveSuccess();
    return;
  }

  showQ();
}

showQ();

/* ================= DRIVING ================= */

let carX=120, obs=[], run=false, ctx, time=30;
let driveInterval=null, anim=null;

function startDrive(){

  stopDrive();

  document.getElementById("driveIntro").style.display="none";
  document.getElementById("driveGame").style.display="block";

  ctx=document.getElementById("game2").getContext("2d");

  run=true;
  time=30;
  carX=120;

  obs=[
    {x:50,y:-80},
    {x:120,y:-160},
    {x:200,y:-240},
    {x:80,y:-320}
  ];

  driveInterval=setInterval(()=>{
    if(!run) return;

    time--;
    document.getElementById("time").innerText=time;

    if(time<=0){
      driveSuccess();
    }

  },1000);

  loop();
}

function stopDrive(){
  run=false;
  clearInterval(driveInterval);
  driveInterval=null;
  if(anim) cancelAnimationFrame(anim);
  anim=null;
}

function crash(){
  stopDrive();
  obs=[];
  setTimeout(()=>resetDrive(),200);
}

function resetDrive(){
  stopDrive();
  carX=120;
  obs=[];
  time=30;

  document.getElementById("driveIntro").style.display="block";
  document.getElementById("driveGame").style.display="none";
}

/* DRIVE SUCCESS (NEW) */
function driveSuccess(){
  stopDrive();

  const d=document.getElementById("driveIntro");
  d.style.display="block";
  d.innerHTML="Success!<br>You've reached the Sydney bridge~";

  setTimeout(()=>go(2),1500);
}

/* ================= LOOP ================= */

function loop(){
  if(!run) return;

  ctx.fillStyle="#111";
  ctx.fillRect(0,0,300,400);

  ctx.fillStyle="#333";
  ctx.fillRect(50,0,200,400);

  ctx.fillStyle="#00d4ff";
  ctx.fillRect(carX,340,40,18);

  ctx.fillStyle="red";

  for(let o of obs){
    o.y+=4;
    ctx.fillRect(o.x,o.y,30,30);

    if(o.y>320 && o.y<360 && o.x<carX+40 && o.x+30>carX){
      crash();
      return;
    }
  }

  anim=requestAnimationFrame(loop);
}

/* ================= STAMINA ================= */

let stamina=100, time3=25;
let bridgeInterval=null;

function startBridge(){

  clearInterval(bridgeInterval);

  stamina=100;
  time3=25;

  document.getElementById("bridgeIntro").style.display="none";
  document.getElementById("bridgeGame").style.display="block";
  document.getElementById("bridgeOverlay").style.display="none";

  bridgeInterval=setInterval(()=>{

    time3--;
    stamina=Math.max(0, stamina-12);

    document.getElementById("fill").style.width=stamina+"%";
    document.getElementById("time3").innerText=time3;

    if(stamina<=0){
      failBridge("MIRA FAINTED 💔");
    }

    if(time3<=0){
      bridgeSuccess();
    }

  },1000);
}

function failBridge(msg){
  clearInterval(bridgeInterval);

  const o=document.getElementById("bridgeOverlay");
  o.style.display="flex";
  o.innerHTML=msg;

  setTimeout(()=>{
    o.style.display="none";
    stamina=100;
    time3=25;
    go(4);
  },2000);
}

/* BRIDGE SUCCESS (NEW) */
function bridgeSuccess(){
  clearInterval(bridgeInterval);

  const o=document.getElementById("bridgeOverlay");
  o.style.display="flex";
  o.innerHTML="Success!<br>Mira crossed the bridge safely~";

  setTimeout(()=>{
    o.style.display="none";
    stamina=100;
    time3=25;
    go(4);
  },1500);
}

/* ================= FINAL ================= */

function showFinal(){

  go(4);

  let el=document.getElementById("finalText");
  el.innerHTML="";

  let text =
`This is the beginning of our adventure together,
No pressure, no expectations~
Let's enjoy our first ever weekend together, hoping it might unlock more opportunities to spend time with each other.
Hang in there a little longer, babe,
Questions will be answered, doubts will be clarified...`;

  let p=document.createElement("p");
  p.innerText=text;

  el.appendChild(p);

  requestAnimationFrame(()=>{
    setTimeout(()=>{
      p.style.opacity="1";
      p.style.transform="translateY(0)";
    },50);
  });
}

</script>

</body>
  </html>
