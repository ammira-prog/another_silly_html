<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Maiku x Mira VN</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Georgia, serif;
  overflow:hidden;
}

.scene{
  display:none;
  height:100vh;
  width:100vw;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  box-sizing:border-box;
  text-align:center;
}

.scene.active{
  display:flex;
}

img{
  width:min(90vw,520px);
  max-height:40vh;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:10px;
}

button{
  padding:10px 14px;
  margin:8px;
  cursor:pointer;
  font-size:16px;
}

.options{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  max-width:600px;
}

.card{
  background:#222;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  min-width:120px;
}

canvas{
  background:#111;
  border-radius:8px;
}

#bar{
  width:80%;
  height:16px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
}

#fill{
  height:100%;
  width:100%;
  background:limegreen;
}

#finalText{
  max-width:650px;
  padding:20px;
  line-height:1.8;
}

#finalText p{
  opacity:0;
  transform:translateY(18px);
  transition:1.2s;
  white-space:pre-line;
}
</style>
</head>

<body>

<!-- AUDIO LAYER -->
<audio id="bgm" loop></audio>
<audio id="sfx"></audio>

<!-- SCENES -->

<div id="s0" class="scene active">
  <img src="image1.jpg">
  <p>Maiku and Mira enter the portal...</p>
  <button onclick="go(1); playSFX('click.mp3'); playBGM('portal.mp3')">Start</button>
</div>

<div id="s1" class="scene">
  <h4>Sydney — Split Timeline</h4>
  <p>Answer the following questions correctly.</p>

  <h3 id="qtext"></h3>
  <div class="options" id="options"></div>

  <button onclick="submit(); playSFX('click.mp3')">Submit</button>
</div>

<div id="s2" class="scene">
  <img src="image2.jpg">

  <div id="driveIntro">
    <p>Passenger Princess mode activated</p>
    <button onclick="startDrive(); playSFX('click.mp3'); playBGM('drive.mp3')">Start Drive</button>
  </div>

  <div id="driveGame" style="display:none;">
    <canvas id="game2" width="300" height="400"></canvas>
    <p>Time: <span id="time">30</span></p>
  </div>
</div>

<div id="s3" class="scene">

  <div id="bridgeIntro">
    <img src="image3.jpg">
    <h3>🌉 Bridge Crossing Mission</h3>
    <p>Get to the Sydney bridge safely before time runs out.</p>
    <button onclick="startBridge(); playSFX('click.mp3'); playBGM('bridge.mp3')">Start Crossing</button>
  </div>

  <div id="bridgeGame" style="display:none;">
    <div id="bar"><div id="fill"></div></div>

    <img src="image3_avatar.png" style="width:240px;height:240px;border-radius:12px;">

    <button onclick="smooch(); playSFX('click.mp3')">💖 SMOOCH</button>

    <p>Time Left: <span id="time3">25</span></p>
  </div>
</div>

<div id="s4" class="scene">
  <img src="image4.jpg">
  <div id="finalText"></div>
</div>

<script>

/* AUDIO */
const bgm = document.getElementById("bgm");
const sfx = document.getElementById("sfx");

function playBGM(file){
  if(!file) return;
  bgm.src = file;
  bgm.volume = 0.4;
  bgm.play().catch(()=>{});
}

function playSFX(file){
  if(!file) return;
  sfx.src = file;
  sfx.volume = 0.6;
  sfx.play().catch(()=>{});
}

/* NAV */
function go(n){
  document.querySelectorAll(".scene").forEach(s=>s.classList.remove("active"));
  document.getElementById("s"+n).classList.add("active");
}

/* SCENE 1 */
let qs=[
["Mira ice cream?",["chocolate","strawberry","rocky road"],"chocolate"],
["Comfort dish?",["soupy dishes","chicken","sushi"],"soupy dishes"],
["Fast food?",["pizza","burger","tacos"],"pizza"],
["Expression?",["ayioo","omg","wtf"],"ayioo"],
["Subject?",["math","history","language"],"math"],
["Overthinking?",["talk more","keep quiet","sleep"],"keep quiet"],
["Likes about Maiku?",["all of the above","brain","humor"],"all of the above"]
];

let i=0;
let selected="";

function showQ(){
  const q=qs[i];
  document.getElementById("qtext").innerText=q[0];

  const box=document.getElementById("options");
  box.innerHTML="";

  q[1].forEach(opt=>{
    let d=document.createElement("div");
    d.className="card";
    d.innerText=opt;
    d.onclick=()=>selected=opt;
    box.appendChild(d);
  });
}

function submit(){
  if(!selected) return;
  if(selected !== qs[i][2]) return;

  selected="";
  i++;

  if(i>=qs.length){
    go(2);
    return;
  }

  showQ();
}

showQ();

/* SCENE 2 */
let carX=120;
let obs=[];
let run=false;
let ctx;
let time=30;
let driveInterval=null;

function startDrive(){

  document.getElementById("driveIntro").style.display="none";
  document.getElementById("driveGame").style.display="block";

  ctx=document.getElementById("game2").getContext("2d");

  run=true;
  time=30;
  carX=120;

  obs=[
    {x:50,y:-80},
    {x:120,y:-160},
    {x:200,y:-240},
    {x:80,y:-320},
    {x:160,y:-400},
    {x:100,y:-480},
    {x:180,y:-560}
  ];

  if(driveInterval) clearInterval(driveInterval);

  driveInterval=setInterval(()=>{
    if(!run) return;

    time--;
    document.getElementById("time").innerText=time;

    if(time<=0){
      resetDrive();
      go(3);
    }
  },1000);

  loop();
}

function resetDrive(){
  run=false;
  clearInterval(driveInterval);

  carX=120;
  obs=[];
  time=30;

  document.getElementById("driveIntro").style.display="block";
  document.getElementById("driveGame").style.display="none";
}

document.getElementById("game2").addEventListener("click",(e)=>{
  if(!run) return;

  let x=e.clientX-e.target.getBoundingClientRect().left;
  carX += (x<150?-20:20);
  carX=Math.max(0,Math.min(260,carX));
});

function loop(){
  if(!run) return;

  ctx.fillStyle="#111";
  ctx.fillRect(0,0,300,400);

  ctx.fillStyle="#333";
  ctx.fillRect(50,0,200,400);

  ctx.fillStyle="#00d4ff";
  ctx.fillRect(carX,340,40,18);

  ctx.fillStyle="red";

  for(let o of obs){
    o.y+=4;
    ctx.fillRect(o.x,o.y,30,30);

    if(o.y>320 && o.y<360 && o.x<carX+40 && o.x+30>carX){
      playSFX("crash.mp3");
      resetDrive();
      go(3);
      return;
    }
  }

  requestAnimationFrame(loop);
}

/* SCENE 3 */
let stamina=100;
let time3=25;
let bridgeInterval=null;

function startBridge(){

  stamina=100;
  time3=25;

  document.getElementById("bridgeIntro").style.display="none";
  document.getElementById("bridgeGame").style.display="block";

  if(bridgeInterval) clearInterval(bridgeInterval);

  bridgeInterval=setInterval(()=>{
    time3--;
    stamina=Math.max(0, stamina-8);

    document.getElementById("fill").style.width=stamina+"%";
    document.getElementById("time3").innerText=time3;

    if(time3<=0){
      clearInterval(bridgeInterval);
      playSFX("success.mp3");
      showFinal();
    }
  },1000);
}

function smooch(){
  stamina=Math.min(100, stamina+15);
}

/* FINAL */
function showFinal(){

  go(4);

  let text =
`This is the beginning of our adventure together,
No pressure, no expectations~
Let's enjoy our first ever weekend together, hoping it might unlock more opportunities to spend time with each other.
Hang in there a little longer, babe,
Questions will be answered, doubts will be clarified, clarity will come within reach, and the longing will soon subside...`;

  let el=document.getElementById("finalText");
  el.innerHTML="";

  let p=document.createElement("p");
  p.innerText=text;

  el.appendChild(p);

  requestAnimationFrame(()=>{
    setTimeout(()=>{
      p.style.opacity="1";
      p.style.transform="translateY(0)";
    },50);
  });
}

</script>

</body>
</html>
